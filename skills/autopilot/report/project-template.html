<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the autopilot run report applied to the whole project: a blue state hero, four stat tiles, then one wide card with the timeline. Colour is a signal: green done, orange in progress, dashed ahead. */
:root{
  --bg:#F2F2F4; --card:#fff; --inset:#F4F4F6; --soft:#EBEBEE; --line:rgba(0,0,0,.07); --line2:rgba(0,0,0,.11);
  --tx:#111113; --tx2:#3A3A3C; --mut:#5E5E63; --quiet:#8E8E93;
  --hero:#2F45E0; --hero-shadow:rgba(40,60,220,.55); --on-hero:#fff; --on-hero2:rgba(255,255,255,.92); --hero-track:rgba(255,255,255,.24);
  --done:#17864A; --done-soft:#E2F3E9; --done-tx:#126B3B; --done-hero:#21A35B; --on-fill:#fff;
  --now:#FF6B35; --now-on:#1A0D06; --now-soft:#FFE9DF; --now-tx:#AD3D0E; --stripe:rgba(255,255,255,.28); --now-track:rgba(26,13,6,.16); --now-mut:rgba(26,13,6,.74);
  --rev:#0B7F8A; --rev-soft:#DDF2F4; --rev-tx:#08666F;
  --idle:#D4D4D9; --on-dark:#fff;
  --sh:0 1px 2px rgba(0,0,0,.04),0 12px 30px -20px rgba(20,24,40,.2);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#17181B; --card:#222327; --inset:#2C2D32; --soft:#323338; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --tx:#F2F2F3; --tx2:#C7C7CC; --mut:#B4B4BB; --quiet:#85858C;
  --hero:#2639C2; --hero-shadow:rgba(0,0,0,.7);
  --done:#1E9A56; --done-soft:#1C3527; --done-tx:#5BD68C;
  --now-soft:#43271C; --now-tx:#FF8A5C;
  --rev:#0E8A96; --rev-soft:#163538; --rev-tx:#6FD6E0;
  --idle:#4A4B51; --quiet:#9A9AA2;
  --sh:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -20px rgba(0,0,0,.75);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#17181B; --card:#222327; --inset:#2C2D32; --soft:#323338; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --tx:#F2F2F3; --tx2:#C7C7CC; --mut:#B4B4BB; --quiet:#85858C;
  --hero:#2639C2; --hero-shadow:rgba(0,0,0,.7);
  --done:#1E9A56; --done-soft:#1C3527; --done-tx:#5BD68C;
  --now-soft:#43271C; --now-tx:#FF8A5C;
  --rev:#0E8A96; --rev-soft:#163538; --rev-tx:#6FD6E0;
  --idle:#4A4B51; --quiet:#9A9AA2;
  --sh:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -20px rgba(0,0,0,.75);
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
.wrap>*{min-width:0}
h1,h2,h3,p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--now);outline-offset:3px}
.ic{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.xs{width:14px;height:14px;stroke-width:2.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:var(--sh);padding:24px 26px;min-width:0}
.wt{font-size:17px;font-weight:650;letter-spacing:-.01em;line-height:1.3}
.whead{display:flex;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:16px;flex-wrap:wrap}
.whead>span{font-size:14px;color:var(--mut)}
.muted{color:var(--mut);font-size:14px;line-height:1.5}
.top h1{font-size:32px;line-height:1.12;font-weight:700;letter-spacing:-.03em;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.when{font-size:14px;color:var(--mut)}

/* Hero */
.hero{border-radius:28px;padding:28px 30px 26px;display:flex;flex-direction:column;gap:26px;background:var(--hero);color:var(--on-hero);box-shadow:0 30px 60px -32px var(--hero-shadow)}
.hero-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px 40px}
.hero-main{flex:1 1 420px;min-width:0}
.state{display:inline-flex;align-items:center;gap:9px;font-size:14px;font-weight:700;margin-bottom:12px}
.live{width:9px;height:9px;border-radius:50%;background:var(--now);outline:2px solid var(--on-hero2);flex:0 0 auto;animation:pulse 1.8s cubic-bezier(.16,1,.3,1) infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,107,53,.6)}70%{box-shadow:0 0 0 9px rgba(255,107,53,0)}100%{box-shadow:0 0 0 0 rgba(255,107,53,0)}}
.hero h2{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.03em;text-wrap:balance;max-width:24ch}
.lead{margin-top:12px;font-size:16.5px;line-height:1.5;color:var(--on-hero2);max-width:64ch}
.aside{margin-top:8px;font-size:14px;line-height:1.5;color:var(--on-hero2);max-width:66ch}
.big{text-align:right;flex:0 0 auto}
.big b{display:block;font-size:58px;line-height:.95;font-weight:700;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.big b small{font-size:24px;letter-spacing:-.02em;font-weight:600;margin-left:6px}
.big>span{display:block;font-size:14px;color:var(--on-hero2);margin-top:10px;max-width:18ch;margin-left:auto}
.track{display:grid;gap:5px}
.seg{height:12px;border-radius:4px;background:var(--hero-track);overflow:hidden}
.s-done .seg{background:var(--done-hero)}
.s-now .seg{background-color:var(--now)}
.s-next .seg{background:repeating-linear-gradient(135deg,var(--hero-track) 0 4px,transparent 4px 8px)}
.s-name{display:block;margin-top:10px;font-size:13px;font-weight:650;line-height:1.3}
.s-pend .s-name{font-weight:500;color:var(--on-hero2)}
.s-time{display:block;margin-top:2px;font-size:12.5px;line-height:1.3;color:var(--on-hero2)}
.how{font-size:13.5px;line-height:1.45;color:var(--on-hero2)}
.hl-row{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:-10px}
.hl{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.hl i{width:16px;height:11px;border-radius:3px;display:block;outline:1px solid var(--hero-track)}

/* Questions band */
.band{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;background:var(--now);color:var(--now-on);border-radius:22px;padding:18px 24px;text-decoration:none;box-shadow:0 18px 40px -26px rgba(200,70,20,.7)}
.band b{font-size:21px;font-weight:700;letter-spacing:-.02em}
.band span{font-size:14.5px;color:var(--now-mut)}
.band .go{margin-left:auto;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;background:var(--now-on);color:var(--on-dark);font-weight:650;font-size:14.5px;white-space:nowrap}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.tile{display:flex;flex-direction:column;gap:10px;padding:20px 22px}
.tk{font-size:13.5px;font-weight:600;color:var(--mut)}
.tv{font-size:38px;line-height:1;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.tv small{font-size:17px;font-weight:600;color:var(--mut);letter-spacing:-.01em;margin-left:4px}
.ts{font-size:13px;color:var(--mut);line-height:1.4}
.stack{position:relative;display:flex;height:10px;border-radius:5px;gap:2px;background:var(--inset)}
.stack i{display:block;height:100%;border-radius:3px}
.stack u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tx);border-radius:1px}
.okb{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:700;align-self:flex-start;background:var(--done);color:var(--on-fill)}
.f-done{background:var(--done);color:var(--on-fill)}
.f-now{background-color:var(--now);color:var(--now-on)}
.f-rev{background:var(--rev);color:var(--on-fill)}
.f-wait{background:transparent;color:var(--mut);border:1.5px dashed var(--idle)}
.f-idle{background:var(--idle)}
.stripes{background-image:linear-gradient(135deg,var(--stripe) 25%,transparent 25%,transparent 50%,var(--stripe) 50%,var(--stripe) 75%,transparent 75%,transparent);background-size:22px 22px;animation:stripes 1.1s linear infinite}
@keyframes stripes{to{background-position:22px 0}}

/* Timeline legend */
.legend{display:flex;flex-wrap:wrap;gap:6px}
.lg{display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:3px 11px 3px 9px;border-radius:999px;background:var(--inset);font-size:13px;font-weight:600;color:var(--tx2)}
.lg i{width:14px;height:11px;border-radius:3px;display:block}
.lg .fl{width:11px;height:11px;border-radius:50%;background:var(--hero)}
.wave{display:flex;align-items:baseline;gap:8px;font-size:12px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--quiet);margin:18px 0 8px}
.wave span{text-transform:none;letter-spacing:0;font-weight:500;font-size:13px}

/* Wide timeline */
.gantt{display:none;position:relative}
.g-head,.g-row{display:grid;grid-template-columns:320px minmax(0,1fr);align-items:center}
.g-days{position:relative;height:50px}
.g-days span{position:absolute;bottom:4px;transform:translateX(-50%);font-size:13px;font-weight:600;color:var(--quiet);font-variant-numeric:tabular-nums}
.g-days em{position:absolute;bottom:28px;font-style:normal;font-size:12px;font-weight:650;color:var(--mut)}
.g-group{font-size:12px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--quiet);padding:14px 0 6px;display:flex;gap:8px;align-items:baseline}
.g-group span{text-transform:none;letter-spacing:0;font-weight:500;font-size:13px}
.g-row{padding:5px 0;border-top:1px solid var(--line)}
.g-row.current{background:var(--now-soft);border-radius:12px;border-top-color:transparent;padding-left:10px;margin-left:-10px}
.g-name{padding-right:16px;min-width:0}
.g-name b{display:block;font-size:14.5px;font-weight:650;line-height:1.3}
.g-name small{display:block;font-size:12.5px;line-height:1.35;color:var(--mut);margin-top:1px}
.g-track{position:relative;height:36px;background-image:repeating-linear-gradient(90deg,var(--line) 0,var(--line) 1px,transparent 1px,transparent var(--day))}
.g-bar{position:absolute;top:50%;height:22px;margin-top:-11px;border-radius:7px;min-width:8px}
.g-cap{position:absolute;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:13px;font-weight:600;color:var(--tx2);margin-left:5px;padding:0 4px;background:var(--card);border-radius:4px;z-index:2}
.g-cap.est{font-weight:500;color:var(--mut)}
.g-flag{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--hero);color:var(--on-hero);display:flex;align-items:center;justify-content:center;z-index:2}
.g-row.current .g-cap{background:transparent}
.g-chip{position:absolute;left:56%;top:50%;transform:translateY(-50%);font-size:13px;color:var(--mut);border:1.5px dashed var(--idle);border-radius:999px;padding:1px 11px;white-space:nowrap;background:var(--card);z-index:2}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--tx);border-radius:1px;pointer-events:none;z-index:1}
.g-todaytag{position:absolute;top:0;transform:translateX(-50%);z-index:3;background:var(--tx);color:var(--card);font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.g-rows{position:relative}
.g-bar.f-wait,.pl-bar.f-wait{background:var(--inset);border-color:var(--quiet)}
.pl-bar.f-wait{color:var(--tx2)}

/* Narrow list */
.plan{display:block}
.pl{margin-bottom:12px}
.pl-bar{min-height:46px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 7px 6px 14px;font-size:14.5px;font-weight:650;line-height:1.25}
.pl-bar.f-flag{background:var(--inset);color:var(--tx)}
.chipin{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.2);font-size:12.5px;font-weight:700;white-space:nowrap}
.f-now .chipin{background:var(--now-track)}
.f-wait .chipin,.f-flag .chipin{background:var(--soft);color:var(--mut)}
.pl-sub{font-size:13.5px;line-height:1.4;color:var(--mut);padding:5px 14px 0}
.pl-sub b{color:var(--tx2);font-weight:650}
.todaybar{display:flex;align-items:center;gap:10px;margin:16px 0 6px;font-size:13px;font-weight:700;color:var(--tx)}
.todaybar::after{content:"";flex:1;height:2px;background:var(--tx);border-radius:1px}

@media (min-width:900px){.gantt{display:block}.plan{display:none}}

/* Details */
details.more{margin-top:16px;border-top:1px solid var(--line);padding-top:6px}
details.more>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:650;padding:6px 0}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(-45deg);transition:transform .15s}
details.more[open]>summary::before{transform:rotate(45deg)}
details.more ul{margin:8px 0 6px;padding:0;list-style:none;display:grid;gap:8px;font-size:14px;color:var(--tx2);line-height:1.5}

/* Changes */
.ev{display:grid;grid-template-columns:26px minmax(0,1fr);gap:11px;align-items:start;padding:10px 0;font-size:14.5px;line-height:1.45;border-top:1px solid var(--line)}
.whead+.ev{border-top:0;padding-top:0}
.ei{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--inset);color:var(--mut)}

/* Run report */
.run-state{background:var(--hero);color:var(--on-hero);border-radius:20px;padding:18px 20px;display:grid;gap:16px;margin-bottom:18px}
.run-state p{font-size:14px;line-height:1.45;color:var(--on-hero2)}
.stages{display:grid;grid-template-columns:repeat(var(--n,10),minmax(0,1fr));gap:5px}
.stages .seg{height:10px}
.s-active .seg{background:var(--now)}
.s-skip .seg{background:repeating-linear-gradient(135deg,var(--hero-track) 0 4px,transparent 4px 8px)}
.s-active .s-name{font-weight:750}
.s-skip .s-name{font-weight:500;color:var(--on-hero2)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px 36px;align-items:start}
.blk h3{font-size:15px;font-weight:650;margin-bottom:8px}
.blk p{font-size:14.5px;line-height:1.5;color:var(--tx2)}
.blk p.ts{font-size:13px;color:var(--mut)}
.big-n{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.big-n small{font-size:15px;color:var(--mut);font-weight:600;margin-left:4px;letter-spacing:0}
.sq{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0 8px}
.sq i{width:18px;height:18px;border-radius:5px;display:block}
.bl{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:14.5px;line-height:1.45;color:var(--tx2)}
.gate{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}
.blk h3+.gate{border-top:0;padding-top:0}
.gi{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.gi.ok{background:var(--done);color:var(--on-fill)}
.gi.warn{background:var(--now);color:var(--now-on)}
.gt{font-size:15px;font-weight:650;line-height:1.35;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.vd{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px}
.vd.ok{background:var(--done-soft);color:var(--done-tx)}
.vd.warn{background:var(--now-soft);color:var(--now-tx)}
.gv{font-size:14px;color:var(--tx2);line-height:1.4}
.gs{font-size:13px;color:var(--mut);margin-top:2px;line-height:1.45}
.nowbox{background:var(--now-soft);color:var(--now-tx);border-radius:14px;padding:12px 15px;font-size:14.5px;line-height:1.45;font-weight:600;margin-top:18px}
.lgs{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mut);margin-top:8px}
.lgs span{display:inline-flex;align-items:center;gap:6px}
.lgs i{width:10px;height:10px;border-radius:3px;display:block}
details.past{margin-top:12px}
details.past>summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;min-height:50px;border-radius:14px;padding:8px 8px 8px 16px;font-size:15px;font-weight:650}
details.past>summary::-webkit-details-marker{display:none}
details.past>summary small{font-size:13px;font-weight:500;opacity:.85}
details.past>summary .chipin{margin-left:auto}
.past-body{padding:16px 2px 8px}
.past-dates{font-size:13.5px;color:var(--mut);margin-bottom:14px}

/* Spend */
.meter{display:grid;gap:5px;margin-top:12px}
.meter-lab{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:600}
.meter-lab b{font-variant-numeric:tabular-nums}
.bar-tick{position:relative;height:12px;border-radius:6px;background:var(--inset)}
.bar-tick i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--hero)}
.bar-tick u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--now)}

.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px 24px}
.gloss div{font-size:14px;line-height:1.45;color:var(--tx2)}
.gloss b{display:block;color:var(--tx);font-weight:650}
footer{font-size:13px;color:var(--mut);padding:2px 4px 0}
/* Word hints */
.term{all:unset;cursor:pointer;border-bottom:1.5px dotted currentColor}
.term:focus-visible{outline:2px solid var(--now);outline-offset:2px}
.hint{position:fixed;z-index:20;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;background:var(--tx);color:var(--card);border-radius:16px;padding:12px 16px;font-size:14.5px;line-height:1.45;box-shadow:0 18px 40px -18px rgba(0,0,0,.6)}
.hint b{display:block}
#err{background:var(--now-soft);color:var(--now-tx);padding:16px 18px;border-radius:18px}

@media (max-width:899px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .track{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:14px 8px}
  .stages{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 6px}
  .cols{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  body{padding-block:16px 32px}
  .card{padding:18px;border-radius:22px}
  .tile{padding:16px}
  .tv{font-size:31px}
  .top h1{font-size:27px}
  .hero{padding:22px 20px;gap:20px;border-radius:24px}
  .hero h2{font-size:27px}
  .lead{font-size:15.5px}
  .big{text-align:left}
  .big b{font-size:50px}
  .big>span{margin-left:0;max-width:none}
  .band{padding:16px 18px}
  .band .go{margin-left:0;width:100%;justify-content:center}
  .run-state{padding:16px}
  .track{grid-template-columns:repeat(2,minmax(0,1fr))!important}
}
@media (prefers-reduced-motion:reduce){.live,.stripes{animation:none}details *{transition:none!important}}

/* Run plan: tickets by wave, the Gantt inside one run */
.rp{margin-top:20px}
.rp h3{font-size:15px;font-weight:650;margin-bottom:8px}
.rp-head,.rp-row{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:12px;align-items:center}
.rp-row{padding:5px 0;border-top:1px solid var(--line)}
.rp-name{font-size:14px;line-height:1.3;color:var(--tx2)}
.rp-name small{color:var(--mut);font-size:12.5px;margin-left:6px}
.rp-track{display:grid;grid-template-columns:repeat(var(--w),minmax(0,1fr));gap:4px}
.rp-track i{height:18px;border-radius:6px;display:block}
.rp-waves span{font-size:12.5px;font-weight:650;color:var(--quiet)}
.f-bad{background:var(--now);color:var(--now-on)}
/* Architecture */
.arch-top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 28px;margin-bottom:14px}
.arch-score{font-size:46px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.arch-score small{font-size:18px;color:var(--mut);font-weight:600;margin-left:6px;letter-spacing:0}
.arch-rounds{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.arch-round{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;background:var(--inset);font-size:13px;font-weight:650;color:var(--tx2);font-variant-numeric:tabular-nums}
.arch-round.ok{background:var(--done-soft);color:var(--done-tx)}
.crit{display:grid;grid-template-columns:minmax(0,1fr) 150px 34px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px;color:var(--tx2)}
.crit b{font-variant-numeric:tabular-nums;text-align:right;color:var(--tx)}
.crit .bar{position:relative;height:9px;border-radius:5px;background:var(--inset)}
.crit .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--done)}
.crit .bar i.low{background:var(--now)}
.crit .bar u{position:absolute;left:90%;top:-3px;bottom:-3px;width:2px;background:var(--tx);border-radius:1px}
.reuse-row{padding:8px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.4;color:var(--tx2)}
.reuse-row b{display:block;color:var(--tx);font-weight:650}
.blk h3+.reuse-row{border-top:0;padding-top:0}
@media (max-width:640px){.rp-head{display:none}.rp-row{grid-template-columns:minmax(0,1fr);gap:5px}.crit{grid-template-columns:minmax(0,1fr) 80px 30px}}
</style>
<script id="data" type="application/json">__DATA__</script>

<div class="wrap" id="app">
  <div class="top">
    <h1>__TITLE__</h1>
    <div class="meta"><span class="when" id="asof"></span></div>
  </div>
</div>

<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const round5 = x => Math.round(x / 5) * 5;
const MS_DAY = 864e5;
const app = document.getElementById("app");
const I = {
  check:'<svg class="ic xs" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  clock:'<svg class="ic xs" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.2 2"/></svg>',
  flag:'<svg class="ic xs" viewBox="0 0 24 24" style="width:11px;height:11px"><path d="M6 21V4h12l-3 4.5 3 4.5H6"/></svg>',
  arrow:'<svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  dot:'<svg class="ic xs" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/></svg>',
  warn:'<svg class="ic xs" viewBox="0 0 24 24"><path d="M12 7v6M12 17v.2"/></svg>'
};
const DATA = JSON.parse(document.getElementById("data").textContent);
const pl = (n,a,b,c) => { const t=n%10,h=n%100; return t===1&&h!==11?a:t>=2&&t<=4&&(h<12||h>14)?b:c; };
const list = items => items.length ? `<ul class="bl">${items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>` : `<p class="ts">Ничего.</p>`;

function renderHero(p){
  const words = {landed:"сделано", now:"идёт сейчас", next:"следующее", pending:"впереди", blocked:"ждёт решения"};
  const cls = {landed:"s-done", now:"s-now", next:"s-next", pending:"s-pend", blocked:"s-pend"};
  const cols = p.runs.map(r=>r.weight+"fr").join(" ");
  const segs = p.runs.map(r=>`<div class="${cls[r.status]}"><div class="seg${r.status==="now"?" stripes":""}"></div><span class="s-name">${esc(r.plain)}</span><span class="s-time">${esc(words[r.status])}</span></div>`).join("");
  return `<section class="hero">
    <div class="hero-top">
      <div class="hero-main">
        <div class="state"><i class="live"></i><span>${esc(p.now.state)}</span></div>
        <h2>${esc(p.now.headline)}</h2>
        ${p.now.sentence?`<p class="lead">${esc(p.now.sentence)}</p>`:""}
        ${p.now.aside?`<p class="aside">${esc(p.now.aside)}</p>`:""}
      </div>
      <div class="big"><b>≈${esc(p.progress.percent)}<small>%</small></b><span>${esc(p.progress.percentLabel)}</span></div>
    </div>
    <div class="track" style="grid-template-columns:${cols}">${segs}</div>
    <div class="hl-row"><span class="hl"><i style="background:var(--done-hero)"></i>сделано</span><span class="hl"><i class="stripes" style="background-color:var(--now)"></i>идёт сейчас</span><span class="hl"><i style="background:repeating-linear-gradient(135deg,var(--hero-track) 0 3px,transparent 3px 6px)"></i>следующее</span><span class="hl"><i style="background:var(--hero-track)"></i>впереди</span></div>
    <p class="how">${esc(p.progress.howTo)} ${esc(p.progress.method)}</p>
  </section>`;
}
function renderBand(q){
  const a=q.open.length, b=q.manual.length;
  if(!a&&!b) return `<div class="card" style="padding:16px 22px"><b>От тебя сейчас ничего не нужно.</b>${q.nextListLabel?` <span class="muted">Следующий список придёт ${esc(q.nextListLabel)}.</span>`:""}</div>`;
  const parts=[]; if(a) parts.push(`${a} ${pl(a,"вопрос","вопроса","вопросов")}`); if(b) parts.push(`${b} ${pl(b,"дело руками","дела руками","дел руками")}`);
  return `<a class="band" href="questions.html"><b>Ждёт тебя: ${parts.join(" и ")}</b><span>${esc(q.heroNote)}${q.nextListLabel?` Следующий список придёт ${esc(q.nextListLabel)}.`:""}</span><span class="go">Открыть решения ${I.arrow}</span></a>`;
}
function renderTiles(p){
  const t = p.progress.tiles, a = p.arch, sp = p.spend, w = (sp.windows||[])[0];
  const last = a ? `<div class="card tile"><span class="tk">Оценка архитектуры</span><span class="tv">${a.score}<small>из 10</small></span><div class="stack"><i class="${a.ok?"f-done":"f-now"}" style="width:${a.score*10}%"></i><u style="left:${a.pass*10}%"></u></div><span class="ts">${esc(a.statusLabel)}</span></div>`
    : w ? `<div class="card tile"><span class="tk">Лимит тарифа</span><span class="tv">${w.used}<small>%</small></span><div class="stack"><i style="width:${w.used}%;background:var(--hero)"></i><u style="left:${sp.ceiling}%"></u></div><span class="ts">${esc(t.limit)}</span></div>`
    : `<div class="card tile"><span class="tk">Лимит тарифа</span><span class="tv">—</span><span class="ts">Данных пока нет.</span></div>`;
  return `<section class="tiles">
    <div class="card tile"><span class="tk">${esc(t.workLabel)}</span><span class="tv">${p.progress.done}<small>из ${p.progress.total}</small></span><div class="stack"><i class="f-done" style="width:${p.progress.done/p.progress.total*100}%"></i></div><span class="ts">${esc(t.work)}</span></div>
    <div class="card tile"><span class="tk">Прогоны</span><span class="tv">${esc(t.runsValue)}<small>${esc(t.runsOf)}</small></span><span class="ts">${esc(t.runs)}</span></div>
    <div class="card tile"><span class="tk">Автотесты</span><span class="tv">${esc(t.tests)}</span><span class="okb">${I.check}${esc(t.testsOk)}</span><span class="ts">${esc(t.testsNote)}</span></div>
    ${last}
  </section>`;
}

function renderTimeline(p){
  const g = p.gantt;
  const tz = p.meta.tz, tzMs = (tz[0]==="-"?-1:1)*(+tz.slice(1,3)*36e5+ +tz.slice(4,6)*6e4);
  const start = Date.parse(g.start+"T00:00:00"+tz), end = Date.parse(g.end+"T00:00:00"+tz)+MS_DAY;
  const span = end-start, days = Math.round(span/MS_DAY);
  const pct = t => (Date.parse(t)-start)/span*100;
  const nowMs = Date.now();
  const todayIso = (nowMs>=start && nowMs<end) ? new Date(nowMs).toISOString() : p.meta.asOf;
  const asOf = Math.min(pct(p.meta.asOf), pct(todayIso));
  const todayPct = pct(todayIso);
  const groups = {done:"Сделано", now:"Идёт сейчас", ahead:"Впереди", milestone:"Ключевые моменты"};
  const groupNote = {done:"даты настоящие", now:"", ahead:"даты примерные", milestone:"что станет возможно"};

  const MONTH = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
  const every = days>90?14:days>50?7:days>28?3:days>16?2:1;
  let dayCells = "";
  for(let i=0;i<days;i++){ const d=new Date(start+i*MS_DAY+tzMs), n=d.getUTCDate();
    if(i===0||n===1) dayCells+=`<em style="left:${i/days*100}%">${MONTH[d.getUTCMonth()]}</em>`;
    if(i%every===0) dayCells+=`<span style="left:${(i+.5)/days*100}%">${n}</span>`; }

  const barHtml = r => {
    if(r.kind==="done"){ const a=pct(r.start), b=pct(r.end); return `<span class="g-bar f-done" style="left:${a}%;width:${b-a}%" title="${esc(r.plain)}: сделано"></span><span class="g-cap" style="left:${b}%">${esc(r.dateText)}</span>`; }
    if(r.kind==="active"){ const a=pct(r.start), b=pct(r.end); return `<span class="g-bar f-now stripes" style="left:${a}%;width:${asOf-a}%;border-radius:7px 0 0 7px" title="${esc(r.plain)}: идёт сейчас"></span><span class="g-bar f-wait" style="left:${asOf}%;width:${b-asOf}%;border-left:0;border-radius:0 7px 7px 0"></span><span class="g-cap est" style="left:${b}%">${esc(r.dateText)}</span>`; }
    if(r.kind==="estimate"){ const a=pct(r.start), b=pct(r.end); return `<span class="g-bar f-wait" style="left:${a}%;width:${b-a}%" title="${esc(r.plain)}: ${esc(r.dateText)}"></span><span class="g-cap est" style="left:${b}%">${esc(r.dateText)}</span>`; }
    if(r.kind==="milestone"){ const a=pct(r.at); return `<span class="g-flag" style="left:${a}%" title="${esc(r.plain)}">${I.flag}</span><span class="g-cap est" style="left:${a}%;margin-left:12px">${esc(r.dateText)}</span>`; }
    return `<span class="g-chip">${esc(r.dateText)}</span>`;
  };
  let wide = "";
  ["done","now","ahead","milestone"].forEach(k=>{
    const rs = g.rows.filter(r=>r.group===k); if(!rs.length) return;
    wide += `<div class="g-group">${groups[k]}${groupNote[k]?` <span>${groupNote[k]}</span>`:""}</div>`;
    wide += rs.map(r=>`<div class="g-row${k==="now"?" current":""}"><div class="g-name"><b>${esc(r.plain)}</b><small>${esc(r.gives)}</small></div><div class="g-track">${barHtml(r)}</div></div>`).join("");
  });

  const chip = {done:`${I.check}сделано`, now:`${I.dot}идёт`, ahead:`${I.clock}примерно`, milestone:`${I.clock}примерно`};
  const fill = {done:"f-done", now:"f-now stripes", ahead:"f-wait", milestone:"f-flag"};
  let narrow = "";
  ["done","now","ahead","milestone"].forEach(k=>{
    const rs = g.rows.filter(r=>r.group===k); if(!rs.length) return;
    if(k==="now") narrow += `<div class="todaybar">Сегодня, ${esc(p.meta.asOfLabel.replace(/,.*/,""))}</div>`;
    narrow += `<div class="wave">${groups[k]}${groupNote[k]?` <span>${groupNote[k]}</span>`:""}</div>`;
    narrow += rs.map(r=>{
      const c = r.kind==="order" ? `${I.clock}без срока` : chip[k];
      return `<div class="pl"><div class="pl-bar ${fill[k]}"><span>${esc(r.plain)}</span><span class="chipin">${c}</span></div><div class="pl-sub"><b>${esc(r.dateText)}.</b> ${esc(r.gives)}</div></div>`;
    }).join("");
  });

  return `<section class="card">
    <div class="whead"><h2 class="wt">Какие этапы пройдены и что впереди</h2>
      <div class="legend">
        <span class="lg"><i class="f-done"></i>сделано</span>
        <span class="lg"><i class="f-now stripes"></i>идёт сейчас</span>
        <span class="lg"><i class="f-wait"></i>впереди, дата примерная (≈)</span>
        <span class="lg"><i class="fl"></i>ключевой момент</span>
      </div>
    </div>
    <div class="gantt" style="--day:${100/days}%">
      <div class="g-head"><div></div><div class="g-days">${dayCells}<div class="g-todaytag" style="left:${todayPct}%">сегодня</div></div></div>
      <div class="g-rows">${wide}<div class="g-today" style="left:calc(320px + (100% - 320px) * ${todayPct/100})"></div></div>
    </div>
    <div class="plan">${narrow}</div>
    <p class="muted" style="margin-top:14px">${esc(g.basisShort)}</p><details class="more"><summary>${esc(g.basisTitle)}</summary><ul>${g.basis.map(b=>`<li>${esc(b)}</li>`).join("")}</ul></details>
  </section>`;
}

function renderChanges(p){
  if(!p.changes.items.length) return "";
  return `<section class="card"><div class="whead"><h2 class="wt">Что изменилось</h2><span>${esc(p.changes.sinceLabel)}</span></div>
    ${p.changes.items.map(i=>`<div class="ev"><span class="ei">${I.check}</span><span>${esc(i)}</span></div>`).join("")}</section>`;
}

function stagesHtml(r){
  const cl = {done:"s-done", active:"s-active", skipped:"s-skip", pending:"s-pend"}, word = {done:"готово", active:"идёт", skipped:"не понадобился", pending:"впереди"};
  const notes = r.stages.filter(s=>s.note).map(s=>`${s.name}: ${s.note}`).join(". ");
  return `<p class="muted" style="margin-bottom:8px">Шаги, которые автопилот проходит в каждом прогоне.</p><div class="run-state">
    <div class="stages" style="--n:${r.stages.length}">${r.stages.map(s=>`<div class="${cl[s.state]}"><div class="seg"></div><span class="s-name">${esc(s.name)}</span><span class="s-time">${word[s.state]}</span></div>`).join("")}</div>
    ${notes?`<p>${esc(notes)}.</p>`:""}
  </div>`;
}
function reqHtml(r){
  if(!r.reqBar) return `<p class="ts" style="margin-top:6px">${esc(r.requirements)}</p>`;
  const b=r.reqBar, t=(b.done+b.prog+b.later)||1;
  return `<div class="stack" style="margin:12px 0 4px"><i class="f-done" style="width:${b.done/t*100}%"></i><i class="f-now" style="width:${b.prog/t*100}%"></i><i class="f-idle" style="width:${b.later/t*100}%"></i></div>
  <div class="lgs"><span><i class="f-done"></i>готовы</span><span><i class="f-now"></i>в работе</span><span><i class="f-idle"></i>отложены</span></div>
  <p class="ts" style="margin-top:8px">${esc(r.requirements)}</p>`;
}
function checkHtml(c){
  if(typeof c==="string") return `<div class="gate"><span class="gi ok">${I.check}</span><div><div class="gt">${esc(c)}</div></div></div>`;
  return `<div class="gate"><span class="gi ${c.ok?"ok":"warn"}">${c.ok?I.check:I.warn}</span><div><div class="gt">${esc(c.t)}<span class="vd ${c.ok?"ok":"warn"}">${c.ok?"хорошо":"внимание"}</span></div><div class="gv">${esc(c.v)}</div><div class="gs">${esc(c.s)}</div></div></div>`;
}
function planHtml(r){
  const waves = r.plan||[]; if(!waves.length) return "";
  const w = waves.length, cls = {done:"f-done", now:"f-now stripes", rev:"f-rev", bad:"f-bad", wait:"f-wait"};
  const head = waves.map(x=>`<span>волна ${x.n}</span>`).join("");
  const rows = waves.map((x,i)=>x.tickets.map(t=>`<div class="rp-row"><div class="rp-name">${esc(t.title)}${t.minutes?`<small>${t.minutes} мин</small>`:""}</div><div class="rp-track" style="--w:${w}"><i class="${cls[t.k]}" style="grid-column:${i+1}"></i></div></div>`).join("")).join("");
  return `<div class="rp"><h3>План прогона</h3><div class="rp-head"><div></div><div class="rp-track rp-waves" style="--w:${w}">${head}</div></div>${rows}
    <div class="lgs"><span><i class="f-done"></i>готово</span><span><i class="f-now"></i>в работе</span><span><i class="f-rev"></i>на проверке или ждёт тебя</span><span><i class="f-wait"></i>впереди</span></div></div>`;
}
function reportBody(r){
  const sq = Array.from({length:r.tasks.total},(_,i)=>`<i class="${i<r.tasks.done?"f-done":"f-idle"}"></i>`).join("");
  return `${stagesHtml(r)}
  <div class="cols">
    <div class="blk"><h3>Что просили</h3><p>${esc(r.brief||"—")}</p></div>
    <div class="blk"><h3>Сколько сделано</h3>
      <div class="big-n">${r.tasks.done}<small>из ${r.tasks.total} кусков работы (тасков)</small></div>
      <div class="sq">${sq}</div>
      ${r.tasks.note?`<p class="ts">${esc(r.tasks.note)}</p>`:""}
      ${reqHtml(r)}
    </div>
    <div class="blk"><h3>Проверки</h3>${r.checks.length?r.checks.map(checkHtml).join(""):`<p class="ts">Проверок ещё не было.</p>`}</div>
    <div style="display:grid;gap:22px">
      <div class="blk"><h3>Решено за тебя</h3>${list(r.assumptions)}</div>
      <div class="blk"><h3>Что не сделано</h3>${list(r.notDone)}</div>
    </div>
  </div>
  ${planHtml(r)}`;
}
function renderArch(p){
  const a = p.arch, u = p.reuse;
  if(!a && !u) return "";
  const crit = a ? a.criteria.map(c=>`<div class="crit"><span>${esc(c.name)}</span><div class="bar"><i class="${c.score<9?"low":""}" style="width:${c.score*10}%"></i><u></u></div><b>${c.score}</b></div>`).join("") : "";
  const rounds = a ? a.rounds.map(r=>`<span class="arch-round${r.overall>=a.pass?" ok":""}">круг ${r.n}: ${r.overall}</span>`).join("") : "";
  const rows = x => x.length ? x.map(c=>`<div class="reuse-row"><b>${esc(c.name)}${c.choice?` · ${esc(c.choice)}`:""}</b>${esc(c.why)}</div>`).join("") : `<p class="ts">Ничего.</p>`;
  return `<section class="card">
    <div class="whead"><h2 class="wt">Как устроен продукт</h2>${a?`<span>${esc(a.statusLabel)}</span>`:""}</div>
    ${a?`<div class="arch-top"><div><div class="arch-score">${a.score}<small>из 10</small></div><p class="ts" style="margin-top:6px">Нужно хотя бы ${a.pass}, и ни одного пункта ниже 8. Оценивает независимый критик.</p></div><div class="arch-rounds">${rounds}</div></div>
    <p class="muted" style="margin-bottom:12px">${esc(a.summary)}</p>
    <details class="more" open><summary>Оценка по пунктам</summary><div style="margin-top:8px">${crit}</div></details>
    ${a.asBuilt?`<p class="ts" style="margin-top:12px">Сверка с написанным кодом: ${a.asBuilt.score} из 10. ${esc(a.asBuilt.summary)}</p>`:""}`:""}
    ${u?`<div class="cols" style="margin-top:18px"><div class="blk"><h3>Берём готовым: ${u.taken.length}</h3>${rows(u.taken)}</div><div class="blk"><h3>Пишем сами: ${u.own.length}</h3>${rows(u.own)}</div></div>`:""}
  </section>`;
}
function renderReports(p){
  const c = p.currentRun, past = p.pastRuns||[];
  const cur = c ? `<section class="card">
    <div class="whead"><h2 class="wt">Отчёт автопилота: ${esc(c.name)}</h2><span>${esc(c.plain)}</span></div>
    <p class="muted" style="margin:-10px 0 14px">${esc(c.statusLabel)}. ${esc(c.dates)}</p>
    ${reportBody(c)}
    ${c.nowDoing?`<p class="nowbox">${esc(c.nowDoing)}</p>`:""}
  </section>` : "";
  const was = past.length ? `<section class="card">
    <div class="whead" style="margin-bottom:4px"><h2 class="wt">Прошлые прогоны</h2><span>нажми, чтобы раскрыть отчёт</span></div>
    ${past.map(r=>`<details class="past"><summary class="f-done"><span>${esc(r.name)}</span><small>${esc(r.plain)}</small><span class="chipin">${I.check}${r.tasks.done} из ${r.tasks.total}</span></summary><div class="past-body"><p class="past-dates">${esc(r.statusLabel)}. ${esc(r.dates)}</p>${reportBody(r)}</div></details>`).join("")}
  </section>` : "";
  return cur + was;
}
function renderSpend(p){
  const s = p.spend, w = s.windows||[];
  if(!w.length && !s.moneyCap) return "";
  const m = x=>`<div class="meter"><div class="meter-lab"><span>${esc(x.label)}</span><b>${x.used} %</b></div><div class="bar-tick"><i style="width:${x.used}%"></i><u style="left:${s.ceiling}%"></u></div></div>`;
  const limit = w.length ? `<div class="card"><div class="whead" style="margin-bottom:6px"><h2 class="wt">Лимит тарифа</h2></div>
      <p class="muted">Сколько объёма твоего тарифа Claude уже потрачено. ${s.verdict?`<b style="color:var(--done-tx)">${esc(s.verdict)}</b>`:""}</p>
      ${w.map(m).join("")}
      <p class="ts" style="margin-top:12px">Оранжевая отметка ${s.ceiling} %${s.ceilingLabel?`: ${esc(s.ceilingLabel)}`:""}. ${esc(s.resetLabel||"")}</p>
      ${s.paceLabel?`<p class="ts" style="margin-top:6px">${esc(s.paceLabel)}</p>`:""}
    </div>` : "";
  const money = s.moneyCap ? `<div class="card"><div class="whead" style="margin-bottom:6px"><h2 class="wt">Деньги на проверки живыми моделями</h2></div>
      <p class="muted">${esc(s.moneyVerdict||"")}</p>
      <div class="big-n" style="margin:12px 0">${esc(s.moneyCap)}<small>предел трат</small></div>
      <p class="ts" style="margin-top:12px">${esc(s.moneyNote||"")}</p>
    </div>` : "";
  return `<section class="cols" style="gap:20px">${limit}${money}</section>`;
}
function renderGloss(p){
  return `<section class="card"><div class="whead"><h2 class="wt">Словарик</h2><span>слова с этой страницы</span></div>
  <div class="gloss">${p.glossary.map(g=>`<div><b>${esc(g[0])}</b>${esc(g[1])}</div>`).join("")}</div></section>`;
}

function wireHints(gl){
  const seen = new Set();
  const walker = document.createTreeWalker(app, NodeFilter.SHOW_TEXT, {acceptNode:n=>n.parentElement.closest(".gloss,h1,.band,button,summary,.term")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    let node=n;
    gl.forEach(([w,def,stem])=>{
      if(seen.has(w)||!stem||!node) return;
      const m = new RegExp("[а-яёa-z]*"+stem+"[а-яёa-z]*","i").exec(node.nodeValue);
      if(!m) return;
      seen.add(w);
      const after = node.splitText(m.index), rest = after.splitText(m[0].length);
      const b = document.createElement("button"); b.type="button"; b.className="term"; b.textContent=m[0]; b.dataset.w=w; b.dataset.d=def;
      after.parentNode.replaceChild(b,after); node=rest;
    });
  });
  let box=null;
  document.addEventListener("click",e=>{
    const t=e.target.closest(".term");
    if(box){box.remove();box=null;}
    if(!t) return;
    box=document.createElement("div"); box.className="hint"; box.setAttribute("role","status");
    const b=document.createElement("b"); b.textContent=t.dataset.w; box.append(b,t.dataset.d);
    document.body.append(box);
  });
}

(function(){
  try{
    const {p,q} = DATA;
    document.getElementById("asof").textContent = "Данные на " + p.meta.asOfLabel + ". " + p.meta.note;
    app.insertAdjacentHTML("beforeend", renderHero(p)+renderBand(q)+renderTiles(p)+renderTimeline(p)+renderChanges(p)+renderArch(p)+renderReports(p)+renderSpend(p)+renderGloss(p)+`<footer>Страница только показывает ход работ и никуда ничего не отправляет.</footer>`);
    wireHints(p.glossary);
  }catch(e){
    app.insertAdjacentHTML("beforeend",`<div id="err">Не удалось показать данные страницы. Напиши об этом в чат, который ведёт разработку.</div>`);
  }
})();
</script>
