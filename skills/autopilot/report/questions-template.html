<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: same system as the project page and the autopilot report: an orange waiting hero with a live answer track, then one card per decision, closed by a single copy action */
:root{
  --bg:#F2F2F4; --card:#fff; --inset:#F4F4F6; --soft:#EBEBEE; --line:rgba(0,0,0,.07); --line2:rgba(0,0,0,.11);
  --tx:#111113; --tx2:#3A3A3C; --mut:#5E5E63; --quiet:#8E8E93;
  --done:#17864A; --done-soft:#E2F3E9; --done-tx:#126B3B; --on-fill:#fff;
  --now:#FF6B35; --now-on:#1A0D06; --now-soft:#FFE9DF; --now-tx:#AD3D0E; --now-track:rgba(26,13,6,.16); --now-mut:rgba(26,13,6,.74);
  --idle:#D4D4D9; --on-dark:#fff;
  --sh:0 1px 2px rgba(0,0,0,.04),0 12px 30px -20px rgba(20,24,40,.2);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#17181B; --card:#222327; --inset:#2C2D32; --soft:#323338; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --tx:#F2F2F3; --tx2:#C7C7CC; --mut:#B4B4BB; --quiet:#85858C;
  --done:#1E9A56; --done-soft:#1C3527; --done-tx:#5BD68C;
  --now-soft:#43271C; --now-tx:#FF8A5C;
  --idle:#4A4B51; --quiet:#9A9AA2;
  --sh:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -20px rgba(0,0,0,.75);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#17181B; --card:#222327; --inset:#2C2D32; --soft:#323338; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --tx:#F2F2F3; --tx2:#C7C7CC; --mut:#B4B4BB; --quiet:#85858C;
  --done:#1E9A56; --done-soft:#1C3527; --done-tx:#5BD68C;
  --now-soft:#43271C; --now-tx:#FF8A5C;
  --idle:#4A4B51; --quiet:#9A9AA2;
  --sh:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -20px rgba(0,0,0,.75);
  color-scheme:dark }
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--tx);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 92px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
.wrap>*{min-width:0}
h1,h2,h3,p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--now);outline-offset:3px}
.ic{width:14px;height:14px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.back{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:999px;background:var(--soft);font-size:13.5px;font-weight:600;text-decoration:none;align-self:flex-start}

.hero{border-radius:28px;padding:26px 28px;display:flex;flex-direction:column;gap:20px;background:var(--now);color:var(--now-on);box-shadow:0 30px 60px -30px rgba(200,70,20,.6)}
.hero-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px 32px}
.hero-main{flex:1 1 340px;min-width:0}
.state{font-size:14px;font-weight:700;margin-bottom:10px}
.hero h1{font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.03em;text-wrap:balance}
.lead{margin-top:10px;font-size:15.5px;line-height:1.5;color:var(--now-mut);max-width:60ch}
.big{flex:0 0 auto;text-align:right}
.big b{display:block;font-size:50px;line-height:.95;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.big b small{font-size:20px;font-weight:600;margin-left:5px;letter-spacing:-.02em}
.big>span{display:block;font-size:13.5px;color:var(--now-mut);margin-top:8px}
.track{display:flex;gap:4px}
.track i{flex:1;height:12px;border-radius:4px;background:var(--now-track);display:block}
.track i.on{background:var(--now-on)}
.track-lab{font-size:13px;color:var(--now-mut);margin-top:-12px}

.sect{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:10px 4px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:var(--sh);padding:22px 24px;display:grid;gap:14px;min-width:0}
.card.answered{border:2px solid var(--done)}
.card.did{border:2px solid var(--done)}
.head{display:flex;gap:12px;align-items:flex-start}
.n{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:750;font-variant-numeric:tabular-nums}
.answered .n,.did .n{background:var(--done);color:var(--on-fill)}
.head h3{font-size:18px;line-height:1.3;font-weight:650;letter-spacing:-.01em;text-wrap:balance;padding-top:2px}
.field{display:grid;gap:2px;min-width:0}
.field>span{font-size:13px;font-weight:650;color:var(--mut)}
.field>div{font-size:15px;line-height:1.5;color:var(--tx2)}
.rec{background:var(--done-soft);padding:12px 14px;border-radius:14px}
.rec>span{color:var(--done-tx)}
.rec b{color:var(--tx);font-weight:650}
.ex{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.ex div{background:var(--inset);border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.45}
.ex span{display:block;font-size:12.5px;font-weight:650;color:var(--mut)}
.urg{align-self:flex-start;display:inline-flex;align-items:center;min-height:24px;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--tx2);font-size:12.5px;font-weight:650}
.urg.need{background:var(--now-soft);color:var(--now-tx)}
.urgrow{display:flex}
.note{font-size:14px;color:var(--mut);line-height:1.45;margin:-8px 4px 0}
.dock{position:fixed;z-index:15;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.dock button{pointer-events:auto;appearance:none;border:0;font:inherit;font-weight:650;font-size:14.5px;height:46px;padding:0 20px;border-radius:999px;background:var(--tx);color:var(--card);cursor:pointer;box-shadow:0 12px 30px -12px rgba(0,0,0,.55)}
.answer{display:grid;gap:9px;border-top:1px solid var(--line);padding-top:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{appearance:none;font:inherit;font-weight:650;font-size:14.5px;cursor:pointer;height:42px;padding:0 18px;border-radius:999px;border:0;background:var(--soft);color:var(--tx);display:inline-flex;align-items:center;gap:7px}
.btn.on{background:var(--done);color:var(--on-fill)}
.st{font-size:13.5px;color:var(--done-tx);font-weight:600}
label.lab{font-size:13.5px;font-weight:650;color:var(--mut)}
textarea{font:inherit;width:100%;min-height:64px;padding:10px 12px;border:1px solid var(--line2);border-radius:14px;background:var(--inset);color:var(--tx);resize:vertical}
ol.steps{margin:0;padding-left:1.25em;display:grid;gap:5px}
.check{display:flex;align-items:center;gap:10px;font-weight:650;cursor:pointer;border-top:1px solid var(--line);padding-top:14px}
.check input{width:22px;height:22px;accent-color:var(--done)}

.final{background:var(--now);color:var(--now-on);border-radius:24px;padding:22px 24px;display:grid;gap:10px}
.final .line{font-weight:650;font-size:16px}
.final .sm{font-size:14px;color:var(--now-mut);line-height:1.45}
#copyBtn{background:var(--now-on);color:var(--on-dark);height:48px;justify-self:start}
#copyMsg{font-size:14px;font-weight:600}
#out{font-family:var(--mono);font-size:13.5px;min-height:110px;background:var(--card);color:var(--tx)}
details.res{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh);padding:6px 22px}
details.res>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:9px;font-size:17px;font-weight:650;padding:12px 0}
details.res>summary::-webkit-details-marker{display:none}
details.res>summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(-45deg);transition:transform .15s}
details.res[open]>summary::before{transform:rotate(45deg)}
.res-item{padding:12px 0;border-top:1px solid var(--line);display:grid;gap:2px}
.res-item b{font-weight:650}
.res-item small{font-size:13px;color:var(--mut)}
.res-item div{font-size:14.5px;line-height:1.45;color:var(--tx2)}
#err{background:var(--now-soft);color:var(--now-tx);padding:16px 18px;border-radius:18px}
@media (max-width:560px){
  body{padding-block:16px 84px}
  .ex{grid-template-columns:minmax(0,1fr)}
  .hero{padding:22px 20px;gap:18px;border-radius:24px}
  .hero h1{font-size:27px}
  .big{text-align:left}
  .card{padding:18px;border-radius:22px}
  .final{padding:20px}
  #copyBtn{justify-self:stretch;justify-content:center}
  .btn{width:100%;justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script id="data" type="application/json">__DATA__</script>
</head>
<body>
<div class="wrap" id="app">
  <a class="back" href="index.html">← Ход проекта</a>
  <section class="hero" id="hero"><div class="hero-top"><div class="hero-main"><h1>Вопросы и ручные дела</h1><p class="lead">Загружаю список…</p></div></div></section>
</div>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CHECK = '<svg class="ic" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const app = document.getElementById("app");
let data, state = {answers:{}, done:{}};
let key = "ap-questions";
const pl = (n,a,b,c) => { const t=n%10,h=n%100; return t===1&&h!==11?a:t>=2&&t<=4&&(h<12||h>14)?b:c; };

function load(){
  try{ const raw = localStorage.getItem(key); if(raw){ const v = JSON.parse(raw); state = {answers:v.answers||{}, done:v.done||{}}; } }catch(e){}
}
function save(){ try{ localStorage.setItem(key, JSON.stringify(state)); }catch(e){} }
const field = (lab, text) => `<div class="field"><span>${esc(lab)}</span><div>${esc(text)}</div></div>`;

function renderQuestion(q){
  return `<article class="card" id="q${q.id}">
    <div class="head"><span class="n">${q.id}</span><h3>${esc(q.title)}</h3></div>
    <div class="urgrow"><span class="urg">${esc(q.urgency||"")}</span></div>
    ${field("О чём речь и откуда вопрос", q.about)}
    ${q.before?`<div class="ex"><div><span>Сейчас</span>${esc(q.before)}</div><div><span>На что ты соглашаешься</span>${esc(q.agrees)}</div></div>`:field("На что ты соглашаешься", q.agrees)}
    <div class="field rec"><span>Рекомендация</span><div><b>${esc(q.recommend)}</b> ${esc(q.why)}</div></div>
    ${field("Если промолчишь", q.silence)}
    <div class="answer">
      <div class="row"><button type="button" class="btn" id="ok${q.id}" data-ok="${q.id}">${CHECK}Ок, как рекомендуешь</button><span class="st" id="st${q.id}"></span></div>
      <label class="lab" for="txt${q.id}">Свой вариант</label>
      <textarea id="txt${q.id}" data-txt="${q.id}" placeholder="Напиши, как сделать иначе"></textarea>
    </div>
  </article>`;
}
function renderManual(m, i){
  return `<article class="card" id="m-${m.id}">
    <div class="head"><span class="n">${i+1}</span><h3>${esc(m.title)}</h3></div>
    <div class="urgrow"><span class="urg ${/Нужно|Важно/.test(m.urgency||"")?"need":""}">${esc(m.urgency||"")}</span></div>
    ${field("Почему это можешь сделать только ты", m.onlyYou)}
    ${field("Зачем", m.why)}
    <div class="field"><span>Что сделать</span><div><ol class="steps">${m.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div></div>
    <label class="check" for="d-${m.id}"><input type="checkbox" id="d-${m.id}" data-done="${m.id}">${esc(m.doneLabel||"Сделал")}</label>
  </article>`;
}
function buildAnswerText(){
  const parts = [], skipped = [];
  data.open.forEach(q=>{
    const a = state.answers[q.id];
    if(a && a.mode==="ok") parts.push(`${q.id} — ок`);
    else if(a && a.mode==="custom" && a.text.trim()) parts.push(`${q.id} — свой вариант: ${a.text.trim().replace(/\s*\n\s*/g," ")}`);
    else skipped.push(q.id);
  });
  let out = `Ответы на список от ${data.listDateLabel}: ` + (parts.length ? parts.join("; ") : "нет ответов");
  const done = data.manual.filter(m=>state.done[m.id]).map(m=>m.short);
  if(done.length) out += `; сделал руками: ${done.join(", ")}`;
  if(parts.length && skipped.length) out += `; без ответа: ${skipped.join(", ")}`;
  return out;
}
const isAnswered = q => { const a=state.answers[q.id]; return !!(a && (a.mode==="ok" || (a.mode==="custom" && a.text.trim()))); };
function refresh(){
  data.open.forEach(q=>{
    const a = state.answers[q.id], isOk = !!(a && a.mode==="ok"), yes = isAnswered(q);
    const ok = document.getElementById("ok"+q.id);
    ok.classList.toggle("on", isOk); ok.setAttribute("aria-pressed", isOk?"true":"false");
    document.getElementById("q"+q.id).classList.toggle("answered", yes);
    document.getElementById("st"+q.id).textContent = isOk ? "Отмечено у тебя. Отправишь внизу страницы" : (yes ? "Свой вариант отмечен. Отправишь внизу страницы" : "");
  });
  data.manual.forEach(m=>document.getElementById("m-"+m.id).classList.toggle("did", !!state.done[m.id]));
  const answered = data.open.filter(isAnswered).length, made = data.manual.filter(m=>state.done[m.id]).length;
  document.getElementById("cnt").textContent = answered;
  document.getElementById("cntm").textContent = `сделано руками: ${made} из ${data.manual.length}`;
  [...document.querySelectorAll("#track i")].forEach((el,i)=>el.classList.toggle("on", !!data.open[i] && isAnswered(data.open[i])));
}
function restoreForm(){
  data.open.forEach(q=>{ const a=state.answers[q.id]; if(a && a.mode==="custom") document.getElementById("txt"+q.id).value=a.text; });
  data.manual.forEach(m=>{ if(state.done[m.id]) document.getElementById("d-"+m.id).checked=true; });
}
function wire(){
  app.addEventListener("click", e=>{
    const b = e.target.closest("[data-ok]");
    if(b){ const id=b.dataset.ok, a=state.answers[id];
      if(a && a.mode==="ok") delete state.answers[id];
      else { state.answers[id]={mode:"ok",text:""}; document.getElementById("txt"+id).value=""; }
      save(); refresh(); }
    if(e.target.closest("#copyBtn")) copyAnswers();
  });
  app.addEventListener("input", e=>{
    if(e.target.dataset && e.target.dataset.txt){ const id=e.target.dataset.txt, text=e.target.value;
      if(text.trim()) state.answers[id]={mode:"custom",text}; else delete state.answers[id];
      save(); refresh(); }
  });
  app.addEventListener("change", e=>{
    if(e.target.dataset && e.target.dataset.done){ const id=e.target.dataset.done;
      if(e.target.checked) state.done[id]=true; else delete state.done[id];
      save(); refresh(); }
  });
}
async function copyAnswers(){
  const text = buildAnswerText(), out = document.getElementById("out"), msg = document.getElementById("copyMsg");
  out.hidden = false; out.value = text;
  let ok = false;
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); ok = true; } }catch(e){}
  out.focus(); out.select();
  msg.textContent = ok ? "Скопировано. Текст показан ниже на всякий случай." : "Скопировать не получилось. Текст ниже уже выделен, скопируй его сам.";
}
(function(){
  try{
    data = JSON.parse(document.getElementById("data").textContent);
    key = "ap-questions-" + data.key;
    if(!data.hasProject) document.querySelector(".back").remove();
    load();
    const a = data.open.length, b = data.manual.length;
    const parts = []; if(a) parts.push(`${a} ${pl(a,"вопрос","вопроса","вопросов")}`); if(b) parts.push(`${b} ${pl(b,"дело руками","дела руками","дел руками")}`);
    document.getElementById("hero").innerHTML = `
      <div class="hero-top">
        <div class="hero-main">
          <div class="state">Список от ${esc(data.listDateLabel)}${data.nextListLabel?`. Следующий ${esc(data.nextListLabel)}`:""}</div>
          <h1>${parts.length?`Ждёт тебя: ${parts.join(" и ")}`:"От тебя сейчас ничего не нужно"}</h1>
          <p class="lead">${esc(data.heroNote)} Ответь, как рекомендуем, или напиши своё. Отметки сохраняются только здесь, а в конце страницы одна кнопка соберёт все ответы в одно сообщение.</p>
        </div>
        <div class="big"><b><span id="cnt">0</span><small>из ${a}</small></b><span>вопросов отвечено</span></div>
      </div>
      <div class="track" id="track">${data.open.map(()=>"<i></i>").join("")}</div>
      <div class="track-lab" id="cntm"></div>`;
    app.insertAdjacentHTML("beforeend", `
      ${a?`<h2 class="sect">Вопросы</h2>${data.open.map(renderQuestion).join("")}`:""}
      ${b?`<h2 class="sect">Сделать руками</h2><p class="note">${esc(data.manualNote)}</p>${data.manual.map(renderManual).join("")}`:""}
      <section class="final" id="final">
        <button type="button" class="btn" id="copyBtn">Скопировать ответы</button>
        <p class="line">Вставь это одним сообщением в чат, который ведёт разработку.</p>
        <p class="sm">Страница ничего не решает и никуда не отправляет: решением считается только твоё сообщение в чате.</p>
        <p id="copyMsg" role="status"></p>
        <textarea id="out" readonly hidden aria-label="Текст ответов"></textarea>
      </section>
      <details class="res"><summary>Решено (${data.resolved.length})</summary>
        ${data.resolved.map(x=>`<div class="res-item"><b>${esc(x.title)}</b><small>${esc(x.date)}</small><div>Твой ответ: ${esc(x.answer)}${x.decision?`<br>Решение: ${esc(x.decision)}`:""}</div></div>`).join("")}
      </details>
      <div class="dock"><button type="button" id="toFinal">К отправке ответов ↓</button></div>`);
    document.getElementById("toFinal").addEventListener("click",()=>document.getElementById("final").scrollIntoView({behavior:"smooth",block:"center"}));
    restoreForm(); wire(); refresh();
  }catch(e){
    app.insertAdjacentHTML("beforeend",`<div id="err">Не удалось показать список. Напиши об этом в чат, который ведёт разработку.</div>`);
  }
})();
</script>
</body>
</html>
